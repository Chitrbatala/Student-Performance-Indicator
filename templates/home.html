<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Student Performance Predictor</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="glass-card">

<h1 class="text-center mb-3">

🎓 Student Performance Predictor

</h1>

<p class="text-center text-muted mb-4">

Enter the student's details below.

</p>

<form action="{{ url_for('predict_datapoint') }}" method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label>Gender</label>

<select class="form-select" name="gender" required>

<option disabled selected>Select Gender</option>

<option value="male">Male</option>

<option value="female">Female</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>Race / Ethnicity</label>

<select class="form-select" name="ethnicity" required>

<option disabled selected>Select</option>

<option value="group A">Group A</option>

<option value="group B">Group B</option>

<option value="group C">Group C</option>

<option value="group D">Group D</option>

<option value="group E">Group E</option>

</select>

</div>

</div>

<div class="mb-3">

<label>Parental Education</label>

<select class="form-select" name="parental_level_of_education" required>

<option disabled selected>Select</option>

<option value="associate's degree">Associate's Degree</option>

<option value="bachelor's degree">Bachelor's Degree</option>

<option value="high school">High School</option>

<option value="master's degree">Master's Degree</option>

<option value="some college">Some College</option>

<option value="some high school">Some High School</option>

</select>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label>Lunch Type</label>

<select class="form-select" name="lunch" required>

<option disabled selected>Select</option>

<option value="standard">Standard</option>

<option value="free/reduced">Free/Reduced</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>Preparation Course</label>

<select class="form-select" name="test_preparation_course" required>

<option disabled selected>Select</option>

<option value="none">None</option>

<option value="completed">Completed</option>

</select>

</div>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label>Reading Score</label>

<input
class="form-control"
type="number"
name="reading_score"
min="0"
max="100"
required>

</div>

<div class="col-md-6 mb-4">

<label>Writing Score</label>

<input
class="form-control"
type="number"
name="writing_score"
min="0"
max="100"
required>

</div>

</div>

<div class="d-grid">

<button class="btn btn-primary btn-lg">

<i class="bi bi-graph-up-arrow"></i>

Predict Maths Score

</button>

</div>

</form>

{% if results %}

<div class="result-card mt-5">

<h3>Prediction Result</h3>

<h1>{{ results|round(2) }}</h1>

<p>Predicted Mathematics Score</p>

</div>

{% endif %}

<div class="text-center mt-4">

<a href="/" class="btn btn-outline-light">

← Back Home

</a>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
